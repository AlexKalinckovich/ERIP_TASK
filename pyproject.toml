[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "currency-exchange-service"
version = "0.1.0"
description = "FastAPI Currency Exchange Service with NBRB integration"
authors = ["Candidate"]

[tool.poetry.dependencies]
python = "^3.14"
fastapi = "^0.162.0"
uvicorn = {extras = ["standard"], version = "^0.28.0"}
pydantic = "^2.14.1"
pydantic-settings = "^2.16.1"
sqlalchemy = "^2.1.6"
asyncpg = "^0.32.0"
alembic = "^1.20.1"
httpx = "==0.28.1"
apscheduler = "^3.11.3"
python-json-logger = "==4.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-asyncio = "^1.3.0"
pytest-mock = "^3.17.0"
testcontainers = {extras = ["postgres"], version = "^4.1.0"}
ruff = "^0.17.2"
openapi-python-client = "^0.29.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]